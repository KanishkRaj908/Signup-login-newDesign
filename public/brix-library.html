/* ===================================================================
   Site chrome — built only from N0 tokens (exact Figma names)
   =================================================================== */
:root { color-scheme: light; }
html.n0-dark { color-scheme: dark; }
html, body { background: var(--colors\/background\/bg-primary); }
body { margin: 0; color: var(--colors\/text\/text-primary-\(900\)); font-family: var(--font-family\/font-family-body); font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font-family: inherit; }
.mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 18px; }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; grid-column: 1 / -1; display: flex; align-items: center; gap: var(--spacing-xl); height: 64px; padding: 0 var(--spacing-3xl); background: var(--colors\/background\/bg-primary); border-bottom: 1px solid var(--colors\/border\/border-secondary); }
.brand { display: flex; align-items: center; gap: var(--spacing-lg); font-weight: 700; font-size: 16px; line-height: 24px; color: var(--colors\/text\/text-primary-\(900\)); text-decoration: none; }
.brand-mark { display: grid; grid-template-columns: repeat(2, 10px); gap: 2px; }
.brand-mark i { width: 10px; height: 10px; border-radius: 2px; background: var(--colors\/background\/bg-brand-solid); }
.brand-mark i:nth-child(2) { background: var(--colors\/background\/bg-quaternary); }
.brand small { font-weight: 500; font-size: 12px; color: var(--colors\/text\/text-quaternary-\(500\)); }
.top .spacer { flex: 1; }
.synced { font-size: 12px; line-height: 18px; color: var(--colors\/text\/text-tertiary-\(600\)); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--radius-full); background: var(--colors\/background\/bg-secondary); border: 1px solid var(--colors\/border\/border-secondary); }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: var(--radius-full); font-size: 12px; line-height: 18px; font-weight: 500; color: var(--colors\/text\/text-tertiary-\(600\)); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--colors\/background\/bg-primary); color: var(--colors\/text\/text-primary-\(900\)); box-shadow: var(--shadows\/shadow-sm); }
.seg button:focus-visible { outline: 2px solid var(--colors\/border\/border-brand); outline-offset: 1px; }
.menu-btn { display: none; border: 1px solid var(--colors\/border\/border-secondary); background: var(--colors\/background\/bg-primary); border-radius: var(--radius-md); width: 36px; height: 36px; cursor: pointer; color: var(--colors\/text\/text-secondary-\(700\)); }

.nav { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 64px); overflow: auto; padding: var(--spacing-3xl) var(--spacing-lg) var(--spacing-4xl); border-right: 1px solid var(--colors\/border\/border-secondary); background: var(--colors\/background\/bg-primary); }
.nav h6 { margin: var(--spacing-3xl) var(--spacing-lg) var(--spacing-md); font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--colors\/text\/text-quaternary-\(500\)); }
.nav h6:first-child { margin-top: 0; }
.nav a { display: flex; align-items: center; justify-content: space-between; padding: 8px var(--spacing-lg); border-radius: var(--radius-md); color: var(--colors\/text\/text-secondary-\(700\)); text-decoration: none; font-weight: 500; font-size: 14px; line-height: 20px; }
.nav a:hover { background: var(--colors\/background\/bg-primary_hover); color: var(--colors\/text\/text-secondary_hover); }
.nav a[aria-current="page"] { background: var(--colors\/background\/bg-secondary); color: var(--colors\/text\/text-primary-\(900\)); font-weight: 700; }
.nav a .count { font-size: 12px; font-weight: 500; color: var(--colors\/text\/text-quaternary-\(500\)); }
.nav a:focus-visible { outline: 2px solid var(--colors\/border\/border-brand); outline-offset: -2px; }

main { min-width: 0; padding: var(--spacing-4xl) var(--spacing-4xl) var(--spacing-7xl); }
.page { max-width: 1200px; margin: 0 auto; }
.eyebrow { font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--colors\/text\/text-quaternary-\(500\)); margin: 0 0 var(--spacing-md); }
h1.title { margin: 0; font-size: 36px; line-height: 44px; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }
.lede { margin: var(--spacing-lg) 0 0; max-width: 720px; font-size: 16px; line-height: 24px; color: var(--colors\/text\/text-tertiary-\(600\)); }
.meta { display: flex; flex-wrap: wrap; gap: var(--spacing-md); margin-top: var(--spacing-xl); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--radius-full); border: 1px solid var(--colors\/border\/border-secondary); font-size: 12px; line-height: 18px; font-weight: 500; color: var(--colors\/text\/text-secondary-\(700\)); background: var(--colors\/background\/bg-primary); text-decoration: none; }
a.chip:hover { background: var(--colors\/background\/bg-primary_hover); }
h2.sec { margin: var(--spacing-6xl) 0 var(--spacing-xl); font-size: 20px; line-height: 30px; font-weight: 700; }
h3.sub { margin: var(--spacing-4xl) 0 var(--spacing-lg); font-size: 16px; line-height: 24px; font-weight: 700; }
p.note { margin: 0 0 var(--spacing-xl); max-width: 720px; color: var(--colors\/text\/text-tertiary-\(600\)); }
.rule { height: 1px; background: var(--colors\/border\/border-secondary); margin: var(--spacing-4xl) 0; }

/* playground (Material-style demo + configuration) */
.pg { display: grid; grid-template-columns: minmax(0, 1fr) 300px; border: 1px solid var(--colors\/border\/border-secondary); border-radius: var(--radius-xl); overflow: hidden; margin-top: var(--spacing-3xl); background: var(--colors\/background\/bg-primary); }
.pg-canvas { min-width: 0; background: var(--colors\/background\/bg-secondary); display: flex; flex-direction: column; }
.pg-bar { display: flex; align-items: center; gap: var(--spacing-md); padding: var(--spacing-lg) var(--spacing-xl); border-bottom: 1px solid var(--colors\/border\/border-secondary); background: var(--colors\/background\/bg-primary); font-size: 12px; line-height: 18px; color: var(--colors\/text\/text-tertiary-\(600\)); flex-wrap: wrap; }
.pg-bar strong { color: var(--colors\/text\/text-secondary-\(700\)); font-weight: 600; }

/* ===================================================================
   N0 components (values from Figma "Nzero DLS"). Colour roles are set
   per hierarchy at runtime from the SPEC tables, which list exact Figma
   token names. Layout values below are the measured Figma values.
   =================================================================== */
.k-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; border: 0; margin: 0; cursor: pointer; white-space: nowrap; font-family: var(--font-family\/font-family-body); font-weight: 500; border-radius: var(--radius-full); text-decoration: none;
  background: var(--b-bg, transparent); color: var(--b-fg); box-shadow: var(--b-fx, none); transition: background-color .12s ease, color .12s ease, box-shadow .12s ease; }

.k-btn .ic svg { width: 100%; height: 100%; display: block; }
.k-btn .sp { display: inline-flex; flex: none; color: var(--b-sp); opacity: var(--b-spo, 1); }
.k-btn .sp svg { width: 100%; height: 100%; display: block; animation: k-spin .9s linear infinite; }
@keyframes k-spin { to { transform: rotate(360deg); } }
.k-btn.h-primary::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,0)); /* raw value in Figma (gradient stroke), not a variable */
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.k-btn:not(.forced):not(:disabled):hover, .k-btn.st-hover { background: var(--b-bg-h, var(--b-bg, transparent)); color: var(--b-fg-h, var(--b-fg)); }
.k-btn:not(.forced):not(:disabled):hover .ic, .k-btn.st-hover .ic { color: var(--b-ic-h, var(--b-ic)); opacity: var(--b-io-h, var(--b-io, 1)); }
.k-btn:not(.forced):focus-visible, .k-btn.st-focus { outline: none; box-shadow: var(--b-fx-f); background: var(--b-bg-f, var(--b-bg, transparent)); border-radius: var(--b-r-f, var(--b-r, var(--radius-full))); }
.k-btn.st-loading { background: var(--b-bg-l, var(--b-bg-h, var(--b-bg, transparent))); color: var(--b-fg-l, var(--b-fg)); cursor: progress; }
.k-btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: var(--b-fx-d, var(--b-fx, none)); }
.k-btn { border-radius: var(--b-r, var(--radius-full)); }
/* sizes — Buttons/Button */
.k-btn.s-xs { height: 32px; padding: 0 var(--spacing-lg); gap: var(--spacing-xs); font-size: var(--font-size\/text-xs); line-height: var(--line-height\/text-xs); }
.k-btn.s-sm { height: 36px; padding: 0 var(--spacing-xl); gap: var(--spacing-xs); font-size: var(--font-size\/text-sm); line-height: var(--line-height\/text-sm); }
.k-btn.s-md { height: 40px; padding: 0 var(--spacing-2xl); gap: var(--spacing-xs); font-size: var(--font-size\/text-sm); line-height: var(--line-height\/text-sm); }
.k-btn.s-lg { height: 44px; padding: 0 var(--spacing-2xl); gap: var(--spacing-sm); font-size: var(--font-size\/text-md); line-height: var(--line-height\/text-md); }
.k-btn.s-xl { height: 48px; padding: 0 var(--spacing-3xl); gap: var(--spacing-sm); font-size: var(--font-size\/text-md); line-height: var(--line-height\/text-md); }
.k-btn.d.s-xl:not(.io):not(.link) { padding: 0 18px; } /* Buttons/Button destructive xl: 18px (not a spacing token in Figma) */
.k-btn.s-xs .ic, .k-btn.s-sm .ic, .k-btn.s-xs .sp, .k-btn.s-sm .sp { width: 16px; height: 16px; }
.k-btn.s-md .ic, .k-btn.s-lg .ic, .k-btn.s-xl .ic, .k-btn.s-md .sp, .k-btn.s-lg .sp, .k-btn.s-xl .sp { width: 20px; height: 20px; }
.k-btn.io { padding: 0; }
.k-btn.io.s-xs { width: 32px; } .k-btn.io.s-sm { width: 36px; } .k-btn.io.s-md { width: 40px; } .k-btn.io.s-lg { width: 44px; } .k-btn.io.s-xl { width: 48px; }
.k-btn.link { height: auto; padding: 0; }
.k-btn.link .lbl { padding: 0; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.k-tip { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); padding: 8px var(--spacing-lg); border-radius: var(--radius-md); background: var(--colors\/background\/bg-primary-solid); color: var(--colors\/text\/text-white); box-shadow: var(--shadows\/shadow-lg); font-size: var(--font-size\/text-xs); line-height: var(--line-height\/text-xs); font-weight: 700; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; }
.k-btn:not(.forced):hover .k-tip, .k-btn.st-hover .k-tip { opacity: 1; }

/* Input field (Type=Default) */
.k-field { display: flex; flex-direction: column; gap: var(--spacing-sm); width: 320px; max-width: 100%; }
.k-field .lw { display: flex; gap: var(--spacing-xxs); font-size: var(--font-size\/text-sm); line-height: var(--line-height\/text-sm); font-weight: 500; color: var(--colors\/text\/text-secondary-\(700\)); }
.k-field .req { color: var(--colors\/text\/text-brand-tertiary-\(600\)); }
.k-field .box { display: flex; align-items: center; gap: var(--spacing-md); background: var(--colors\/background\/bg-primary); border: 1px solid var(--colors\/border\/border-secondary); transition: box-shadow .12s, border-color .12s; }
.k-field.s-sm .box { height: 36px; padding: 0 var(--spacing-lg); border-radius: var(--radius-md); }
.k-field.s-md .box { height: 40px; padding: 0 var(--spacing-lg); border-radius: var(--radius-lg); }
.k-field.s-lg .box { height: 44px; padding: 0 14px; border-radius: var(--radius-lg); } /* 14px: Figma value, no spacing token */
.k-field .content { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--spacing-md); }
.k-field .lead { display: inline-flex; color: var(--colors\/foreground\/fg-quaternary-\(400\)); flex: none; }
.k-field.s-sm .lead { width: 16px; height: 16px; } .k-field.s-md .lead, .k-field.s-lg .lead { width: 20px; height: 20px; }
.k-field.s-sm .lead svg path { stroke-width: 1.875; } /* 1.5px at 16px, as in Figma */
.k-field .lead svg, .k-field .trail svg { width: 100%; height: 100%; display: block; }
.k-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; margin: 0; font-size: var(--font-size\/text-sm); line-height: var(--line-height\/text-sm); font-weight: 500; color: var(--colors\/text\/text-primary-\(900\)); font-family: var(--font-family\/font-family-body); }
.k-field input::placeholder { color: var(--colors\/text\/text-placeholder); opacity: 1; }
.k-field .trail { display: inline-flex; width: 16px; height: 16px; flex: none; color: var(--colors\/foreground\/fg-quaternary-\(400\)); }
.k-field .hint { margin: 0; font-weight: 400; color: var(--colors\/text\/text-tertiary-\(600\)); font-size: var(--font-size\/text-sm); line-height: var(--line-height\/text-sm); }
.k-field.s-sm .hint { font-size: var(--font-size\/text-xs); line-height: var(--line-height\/text-xs); }
.k-field:not(.forced) .box:focus-within, .k-field.st-focus .box { border-color: var(--colors\/border\/border-brand); box-shadow: inset 0 0 0 0.5px var(--colors\/border\/border-brand); }
.k-field.err .req, .k-field.err .hint { color: var(--colors\/text\/text-error-primary-\(600\)); }
.k-field.err .box { border-color: var(--colors\/border\/border-error_subtle); }
.k-field.err:not(.forced) .box:focus-within, .k-field.err.st-focus .box { border-color: var(--colors\/border\/border-error); box-shadow: inset 0 0 0 0.5px var(--colors\/border\/border-error); }
.k-field.err .trail { color: var(--colors\/foreground\/fg-error-secondary); }
.k-field.dis .box { background: var(--colors\/background\/bg-tertiary); opacity: .5; }
.k-field.dis input { cursor: not-allowed; }

/* Checkbox / Radio (_Checkbox base + Checkbox) */
.k-check { position: relative; display: inline-flex; align-items: flex-start; cursor: pointer; }
.k-check.s-sm { gap: var(--spacing-md); } .k-check.s-md { gap: var(--spacing-lg); }
.k-check input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.k-check .bx { flex: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--colors\/border\/border-primary); color: var(--colors\/foreground\/fg-white); transition: background-color .12s, box-shadow .12s; }
.k-check.has-text .bx { margin-top: 2px; }
.k-check.s-sm .bx { width: 16px; height: 16px; border-radius: var(--radius-xs); } .k-check.s-md .bx { width: 20px; height: 20px; border-radius: var(--radius-sm); }
.k-check.radio .bx { border-radius: var(--radius-full); }
.k-check .bx svg { display: block; }
.k-check.s-sm .bx svg { width: 12px; height: 12px; } .k-check.s-md .bx svg { width: 14px; height: 14px; }
.k-check .dot { border-radius: var(--radius-full); background: var(--colors\/foreground\/fg-white); }
.k-check.s-sm .dot { width: 6px; height: 6px; } .k-check.s-md .dot { width: 8px; height: 8px; }
.k-check.on .bx { background: var(--colors\/background\/bg-brand-solid); border-color: transparent; }
.k-check:not(.forced) input:focus-visible + .bx, .k-check.st-focus .bx { box-shadow: var(--focus-rings\/focus-ring); }
.k-check:not(.on).st-focus .bx, .k-check:not(.on):not(.forced) input:focus-visible + .bx { background: var(--colors\/background\/bg-primary); }
.k-check.dis { cursor: not-allowed; }
.k-check.dis .bx { opacity: .5; }
.k-check.dis:not(.on) .bx { background: var(--colors\/background\/bg-tertiary); }
.k-check .tx { display: flex; flex-direction: column; }
.k-check.s-md .tx { gap: var(--spacing-xxs); }
.k-check .t1 { font-weight: 500; color: var(--colors\/text\/text-secondary-\(700\)); }
.k-check .t2 { font-weight: 400; color: var(--colors\/text\/text-tertiary-\(600\)); }
.k-check.s-sm .t1, .k-check.s-sm .t2 { font-size: var(--font-size\/text-sm); line-height: var(--line-height\/text-sm); }
.k-check.s-md .t1, .k-check.s-md .t2 { font-size: var(--font-size\/text-md); line-height: var(--line-height\/text-md); }

/* Toggle (_Toggle base + Toggle) */
.k-tg { position: relative; display: inline-flex; align-items: flex-start; cursor: pointer; }

/* ---------- helpers ---------- */
const code = (f) => f.toLowerCase().replace(/ /g, '-');
const esc = (n) => n.replace(/[\/()\.,]/g, (c) => '\\' + c);
const V = (f) => `var(--${esc(code(f))})`;               // Figma name → CSS var() exactly as Figma Dev Mode writes it
const CSSNAME = (f) => `var(--${esc(code(f))})`;
const h = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s, el = document) => el.querySelector(s);
const FULL = (leaf) => {                                  // short leaf → full Figma name
  if (/\//.test(leaf)) return leaf;
  if (/^bg-/.test(leaf)) return 'Colors/Background/' + leaf;
  if (/^text-/.test(leaf)) return 'Colors/Text/' + leaf;
  if (/^fg-/.test(leaf)) return 'Colors/Foreground/' + leaf;
  if (/^border-/.test(leaf)) return 'Colors/Border/' + leaf;
  return leaf;
};
const SEMI = Object.fromEntries(DATA.semantic.map((t) => [t.n, t]));
const isDark = () => document.documentElement.classList.contains('n0-dark');
const hexOf = (full) => { const t = SEMI[full]; return t ? (isDark() ? t.d : t.l) : ''; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1600); }
function copy(text) {
  const done = () => toast('Copied ' + (text.length > 48 ? text.slice(0, 46) + '…' : text));
  try { navigator.clipboard.writeText(text).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Select and copy: ' + text); } ta.remove(); }
}
document.addEventListener('click', (e) => { const t = e.target.closest('[data-copy]'); if (t) { e.preventDefault(); copy(t.getAttribute('data-copy')); } });
const tokChip = (full, withSwatch = true) => { full = FULL(full); const sw = withSwatch && SEMI[full] ? `<i style="background:${V(full)}"></i>` : ''; return `<span class="tok" data-copy="${h(CSSNAME(full))}" title="Copy ${h(CSSNAME(full))}">${sw}${h(full.split('/').pop())}</span>`; };
const ico = (name) => ICONS[name] || '';

/* ---------- theme ---------- */
function setTheme(dark) {
  document.documentElement.classList.toggle('n0-dark', dark);
  $('#thL').setAttribute('aria-pressed', String(!dark)); $('#thD').setAttribute('aria-pressed', String(dark));
  try { localStorage.setItem('n0-theme', dark ? 'dark' : 'light'); } catch (e) {}
  if (current && current.refresh) current.refresh();
}
$('#thL').onclick = () => setTheme(false); $('#thD').onclick = () => setTheme(true);

/* ---------- canvases ---------- */
function canvas(id, s) {
  if (id === 'button' || id === 'button-destructive') {
    const C = COMPONENTS[id]; const sizes = s.allSizes ? ['xs', 'sm', 'md', 'lg', 'xl'] : [s.size];
    return `<div class="grid-rows">` + C.hiers.map((hier) => {
      const link = /^Link/.test(hier);
      const cells = sizes.map((sz) => `<div class="cell">${C.render(s, hier, sz)}${s.allSizes ? `<span class="cap">${sz}</span>` : ''}</div>`).join('');
      return `<div class="vrow"><div class="rl">${h(hier)}<span>Hierarchy=${h(hier)}${link && s.iconOnly ? ' · no icon-only form' : ''}</span></div><div class="items">${cells}</div></div>`;
    }).join('') + `</div>`;
  }
  if (id === 'input-field') {
    const main = renderField(s);
    const states = ['Placeholder', 'Filled', 'Focused', 'Disabled'];
    const grid = [false, true].map((d) => `<div class="vrow" style="align-items:start"><div class="rl">Destructive=${d ? 'True' : 'False'}</div><div class="items" style="align-items:start">${states.map((st) => `<div class="cell"><span class="cap">State=${st}</span>${renderField({ ...s, destructive: d, state: st })}</div>`).join('')}</div></div>`).join('');
    return `<div class="grid-rows"><div class="vrow" style="align-items:start"><div class="rl">Configured<span>Size=${s.size}</span></div><div class="items">${main}</div></div><div class="rule" style="margin:0"></div>${grid}</div>`;
  }
  if (id === 'checkbox' || id === 'radio') {
    const radio = id === 'radio'; const combos = radio ? [['Unchecked', false, false], ['Checked', true, false]] : [['Unchecked', false, false], ['Checked', true, false], ['Indeterminate', true, true]];
    const states = s.state === 'Interactive' ? ['Interactive', 'Default', 'Focused', 'Disabled'] : [s.state];
    return `<div class="grid-rows">` + combos.map(([nm, ch, ind]) => `<div class="vrow" style="align-items:start"><div class="rl">${nm}<span>Checked=${ch ? 'True' : 'False'}${radio ? '' : ', Indeterminate=' + (ind ? 'True' : 'False')}</span></div><div class="items" style="align-items:start">${states.map((st) => `<div class="cell"><span class="cap">${st === 'Interactive' ? 'Interactive (click me)' : 'State=' + st}</span>${renderCheck({ ...s, ...COMPONENTS[id].fixed, checked: ch, indeterminate: ind, state: st })}</div>`).join('')}</div></div>`).join('') + `</div>`;
  }
  if (id === 'toggle') {
    const states = s.state === 'Interactive' ? ['Interactive', 'Default', 'Hover', 'Focus', 'Disabled'] : [s.state];
    return `<div class="grid-rows">` + [['Off', false], ['On', true]].map(([nm, on]) => `<div class="vrow" style="align-items:start"><div class="rl">${nm}<span>Pressed=${on ? 'True' : 'False'}</span></div><div class="items" style="align-items:start">${states.map((st) => `<div class="cell"><span class="cap">${st === 'Interactive' ? 'Interactive (click me)' : 'State=' + st}</span>${renderToggle({ ...s, pressed: on, state: st })}</div>`).join('')}</div></div>`).join('') + `</div>`;
  }
  if (id === 'badge') {
    const types = s.allTypes ? ['Pill color', 'Badge color', 'Badge modern'] : [s.type];
    const colors = s.color === 'All' ? Object.keys(BADGE_COLORS) : [s.color];
    return `<div class="grid-rows">` + types.map((t) => `<div class="vrow"><div class="rl">${t}<span>Type=${t}</span></div><div class="items tight">${colors.map((c) => `<span title="Color=${c}">${renderBadge({ ...s, type: t, color: c })}</span>`).join('')}</div></div>`).join('') + `</div>`;
  }
  return '';
}

      if (p.t === 'text') return `<div class="cfg-group"><label class="cfg-label" for="cfg-${id}-${p.k}">${h(p.p)}</label><input class="txt" id="cfg-${id}-${p.k}" data-i="${i}" value="${h(st[p.k])}"></div>`;
      return '';

  stage.addEventListener('click', (e) => { const lab = e.target.closest('[data-k]'); if (lab && lab.classList.contains('forced')) e.preventDefault();

  drawCfg(); drawStage();
  current = { refresh: drawStage };
}
